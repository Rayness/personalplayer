<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Music</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="header glass">
    <span class="header__logo">Personal Music</span>
    <nav class="nav">
      <a href="#" class="nav-link active" data-page="tracks">Каталог</a>
      <a href="#" class="nav-link" data-page="add-songs">Добавить</a>
      <a href="#" class="nav-link" data-page="peers">Узлы</a>
    </nav>
  </header>

  <main id="content"></main>

  <div class="player glass" id="audioPlayer">
    <div class="player__left">
      <img class="player__cover" src="" alt="">
      <div class="player__info">
        <p class="player__title">Выберите трек</p>
        <p class="player__artist"></p>
      </div>
    </div>

    <div class="player__center">
      <div class="player__controls">
        <button class="btn-icon" id="shuffle" title="Перемешать">
          <i class="fa-solid fa-shuffle"></i>
        </button>
        <button class="btn-icon" id="prev" title="Предыдущий">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button class="btn-icon btn-play" id="play-pause" title="Пауза / Воспроизведение">
          <i class="fa-solid fa-play"></i>
        </button>
        <button class="btn-icon" id="next" title="Следующий">
          <i class="fa-solid fa-forward-step"></i>
        </button>
        <button class="btn-icon" id="repeat" title="Повтор">
          <i class="fa-solid fa-repeat"></i>
        </button>
      </div>
      <div class="player__progress">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressSlider" min="0" max="100" value="0">
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <div class="player__right">
      <i class="fa-solid fa-volume-low"></i>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
